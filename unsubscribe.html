<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Email preferences | Luce Healing</title><style>body{font:17px/1.6 system-ui;background:#f1ebf5;color:#392c44;margin:0;padding:60px 24px}main{max-width:480px;margin:auto;background:white;padding:32px;border-radius:16px}button{background:#624373;color:white;border:0;padding:15px 24px;font:inherit;border-radius:6px;cursor:pointer}a{color:#624373}</style><link rel="stylesheet" href="/review-fixes.css"></head><body><main><h1>Your inbox, your choice.</h1><p>Use the button below to stop receiving Luce Healing's blogs and offers. This does not cancel a reading or session you purchased.</p><button id="unsubscribe">Unsubscribe from emails</button><p id="status" role="status" aria-live="polite"></p><a href="/">Back to Luce Healing</a></main><script>
const button=document.getElementById('unsubscribe');
button.addEventListener('click',async()=>{button.disabled=true;const status=document.getElementById('status');try{const r=await fetch('/api/newsletter/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token')})});const d=await r.json();status.textContent=d.message||d.error;if(!r.ok)button.disabled=false;}catch(_){status.textContent='Unable to connect. Please try again.';button.disabled=false;}});
</script></body></html>
