name: Gift release checks
on:
  pull_request:
    paths:
      - 'gift.js'
      - 'gifts.js'
      - 'gift-catalog.js'
      - 'promotion-deadline.js'
      - 'test/black-friday-gifts.test.js'
      - '.github/workflows/gift-release-checks.yml'
jobs:
  gift-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check gift.js && node --check gifts.js
      - run: node --test test/black-friday-gifts.test.js
