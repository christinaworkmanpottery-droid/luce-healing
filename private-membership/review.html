<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private membership review | Luce Healing</title><link rel="stylesheet" href="/members/assets/style.css"></head><body><main><header><a href="/">Luce Healing</a><h1>Your private membership preview</h1></header><section class="card"><p>Use your existing Luce Admin password to enter. Public membership purchasing is disabled.</p><form id="review"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button>Open private preview</button><a class="button" href="/admin.html">Membership publishing in Admin</a></div></form><p id="feedback" role="status"></p></section></main><script>document.getElementById('review').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await fetch('/api/membership/review-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const x=await r.json();if(!r.ok)throw Error(x.error);location.assign(x.url);}catch(err){document.getElementById('feedback').textContent=err.message;}finally{b.disabled=false;}};</script></body></html>
